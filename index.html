<script>const poems=[
['Autores',`Osvaldo de Jesus\n“El saber y el pensar son dos cosas que se pueden evitar.. o modificar”\n\nMauricio Gtz\n“El saber es la verdad de todo hecho”`],
['Tu sonrisa',`Hay algo sencillo en tu sonrisa,\nalgo que no necesita explicación;\nllega sin pedir permiso\ny le cambia el ritmo al corazón.\n\nTal vez para ti sea un gesto cualquiera,\npero para mí tiene otra luz:\nhay días que se vuelven más bonitos\nsolo porque en ellos sonríes tú.`],
['Tus ojos',`Tus ojos no necesitan promesas\npara hacerme querer quedarme;\ntienen esa calma extraña\nque consigue desarmarme.\n\nNo sé si es su brillo o su manera\nde mirar el mundo alrededor,\npero cuando encuentro tu mirada\nhasta el silencio dice amor.`],
['Tu carisma',`No es solo cómo te ves,\nes lo que ocurre cuando llegas:\nla forma en que cambia el ambiente,\nla facilidad con que lo alegras.\n\nTienes algo que no se aprende,\nque no se compra ni se ensaya;\nes simplemente ser tú misma,\ny que con eso todo vaya.`],
['Tu risa',`Me gusta cuando tu risa aparece\nsin aviso y sin explicación,\nporque por un pequeño instante\nparece más ligero el corazón.\n\nSi algún día olvidas cuánto vale,\nquisiera poderte recordar:\nhay sonidos que llenan un cuarto,\ny el tuyo lo sabe iluminar.`],
['Tu voz',`Hay palabras que son solo palabras\nhasta que las dices tú;\nentonces suenan diferentes,\ncomo si encontraran otra luz.\n\nY aunque hables de cosas pequeñas,\ny aunque no haya nada especial,\nme gusta escuchar esos momentos\nque vuelven extraordinario lo normal.`],
['Tu forma de ser',`Podría hablar de tu sonrisa,\nde tus ojos y de tu mirar,\npero lo que más permanece\nes tu manera de tratar.\n\nPorque la belleza llama la atención,\npero hay algo que vale todavía más:\nla persona que eres cuando nadie mira,\neso es difícil de olvidar.`],
['Los detalles',`A veces no son grandes momentos,\nni frases hechas para recordar;\nson esos detalles diminutos\nque sin querer me hacen pensar.\n\nUna palabra, un gesto, una mirada,\nuna historia que decidiste contar;\nquizá tú los olvides mañana,\npero yo los quisiera guardar.`],
['Un día cualquiera',`No necesito un día perfecto,\nni un cielo distinto sobre mí;\na veces basta una coincidencia,\nun momento compartido junto a ti.\n\nPorque tienes esa rara costumbre\nde volver especial lo habitual;\ny sin cambiar nada del mundo,\nhaces distinto un día normal.`],
['Cuando no estás',`Hay personas cuya ausencia\nse confunde pronto con el día;\nla tuya deja un pequeño espacio,\ncomo una pausa en la melodía.\n\nNo porque el mundo deje de girar,\nsino porque aprendí algo de ti:\nque algunos momentos son mejores\ncuando puedo compartirlos contigo aquí.`],
['Que seas feliz',`Si querer también significa\ndesearle al otro claridad,\nentonces quiero para tus días\nmucha calma y felicidad.\n\nQue nunca te falten motivos,\nque conserves tu forma de brillar;\ny que aun cuando el camino sea difícil,\nencuentres razones para continuar.`],
['Tú',`Intenté escribir sobre tus ojos,\ntu sonrisa, tu voz y tu bondad;\npero cada página confirma\nque no cabes en una cualidad.\n\nPorque no es una sola cosa\nla que te hace especial para mí:\nes la suma de tantos detalles,\nes, sencillamente, que eres tú.`],
['Tu presencia',`No hace falta que ocurra algo enorme\npara que un momento tenga valor;\na veces basta con que estés presente\ny el día cambia alrededor.\n\nHay personas que llegan haciendo ruido,\ny otras que simplemente saben estar;\ntú tienes esa forma tranquila\nde volver bonito cualquier lugar.`],
['Lo que inspiras',`Hay días en los que una palabra\npuede cambiar la dirección;\ny a veces, sin darte cuenta,\ntú haces eso en mi corazón.\n\nNo porque tengas que intentarlo,\nni porque debas demostrar;\nes solo esa forma tan tuya\nde existir y de inspirar.`],
['Coincidencia',`Entre tantos caminos posibles,\nentre tanta gente y tanto lugar,\nqué curiosa fue la coincidencia\nde algún día poderte encontrar.\n\nNo sé qué escribirá el tiempo\nni qué historias quedarán;\npero algunas coincidencias pequeñas\nse sienten enormes al recordar.`],
['Una página más',`Si cada recuerdo fuera una página\ny cada sonrisa una señal,\neste libro seguiría creciendo\nsin encontrar todavía su final.\n\nPorque siempre aparece un detalle,\nalgo nuevo que poder guardar;\ny quizá esa sea la magia:\nque aún quede mucho por contar.`],
['Después de estas páginas',`Podría seguir buscando palabras,\nllenar otro libro y continuar;\npero algunas cosas que uno siente\nningún poema las termina de explicar.\n\nAsí que dejo aquí estas páginas,\nno como un final, sino como señal:\ndespués de tantas palabras escritas,\ntodavía me faltan muchas más.\n\n“Muchas mujeres hicieron el bien;\nmas tú sobrepasas a todas.”\n— Proverbios 31:29`]
];

const lifePoems=[
['Sin nombre... bueno',`No todo necesita un nombre para tener significado.\nA veces basta con estar aquí, seguir leyendo\ny dejar que unas cuantas palabras hablen por nosotros.`],
['Seguir',`Hay días que avanzan despacio\ny otros que parecen volar;\nlo importante no es ir deprisa,\nsino no dejar de caminar.`],
['El tiempo',`El tiempo no pregunta si estamos listos,\nsimplemente aprende a pasar;\npor eso algunos instantes pequeños\nson los que más vale guardar.`],
['Cambiar',`Cambiar no siempre significa perder\nlo que alguna vez fuimos ayer;\na veces es aprender otra forma\nde mirar, de intentar y crecer.`],
['Los días simples',`No todos los días serán historias\nque queramos siempre contar;\npero hasta en lo más cotidiano\nhay algo que podemos valorar.`],
['Recuerdos',`Un recuerdo no vuelve el tiempo,\npero sabe encender una luz;\nnos recuerda que alguna versión nuestra\ntambién llegó hasta donde estás tú.`],
['Aprender',`Equivocarse también deja caminos,\npreguntas que enseñan a pensar;\nno todo error es una derrota\nsi de él aprendemos a avanzar.`],
['Pequeñas cosas',`Una canción, una tarde tranquila,\nuna charla que llegó sin plan;\nla vida suele esconder su belleza\nen cosas que pequeñas parecen estar.`],
['Sueños',`Los sueños no vienen con mapas\nni prometen facilidad;\npero tener algo que perseguir\ntambién le da rumbo a la realidad.`],
['Pausa',`Descansar no borra el camino\nni significa retroceder;\na veces una pausa es justo\nlo que hace falta para volver.`],
['Personas',`Algunas personas pasan rápido,\notras dejan algo al marchar;\ncada encuentro escribe una línea\nen la historia que vamos a formar.`],
['Hoy',`Tal vez hoy no sea perfecto,\npero sigue siendo una oportunidad;\nuna página que todavía tiene\nespacio para algo que recordar.`],
['Valentía',`Ser valiente no siempre hace ruido\nni necesita a todos impresionar;\na veces es intentar de nuevo\ncuando sería más fácil abandonar.`],
['Tu historia',`No compares todas tus páginas\ncon el capítulo de alguien más;\ncada historia encuentra su ritmo\ny la tuya aún tiene mucho detrás.`],
['Mañana',`No sabemos qué trae mañana\ny quizá ahí vive su emoción;\npor ahora basta cuidar el presente\ny seguir escribiendo la continuación.`]
];
let activePoems=poems; let visitor=''; let i=0; let soundOn=true; let audioCtx=null;
let ambientNodes=null, ambientOn=false;
function ensureAudio(){audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx;}
function startAmbient(){
  if(ambientOn) return; const ac=ensureAudio(); ambientOn=true;
  const master=ac.createGain(); master.gain.setValueAtTime(.0001,ac.currentTime); master.gain.exponentialRampToValueAtTime(.22,ac.currentTime+1.2); master.connect(ac.destination);
  // Lluvia continua: ruido filtrado suave, como agua sobre hojas y suelo.
  const seconds=4, n=ac.sampleRate*seconds, buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0); let last=0;
  for(let j=0;j<n;j++){const white=Math.random()*2-1; last=.985*last+.015*white; d[j]=white*.28+last*.72;}
  const rainSrc=ac.createBufferSource(); rainSrc.buffer=buf; rainSrc.loop=true;
  const rainFilter=ac.createBiquadFilter(); rainFilter.type='lowpass'; rainFilter.frequency.value=4300;
  const rainGain=ac.createGain(); rainGain.gain.value=.5; rainSrc.connect(rainFilter).connect(rainGain).connect(master); rainSrc.start();
  // Brisa grave y tranquila.
  const wind=ac.createOscillator(), windGain=ac.createGain(); wind.type='sine'; wind.frequency.value=74; windGain.gain.value=.018; wind.connect(windGain).connect(master); wind.start();
  // Gotas cercanas ocasionales.
  const timers=[]; function drip(){if(!ambientOn)return; const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(700+Math.random()*650,now);o.frequency.exponentialRampToValueAtTime(260+Math.random()*180,now+.09);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.035+Math.random()*.025,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.16);o.connect(g).connect(master);o.start(now);o.stop(now+.18);timers.push(setTimeout(drip,420+Math.random()*1100));} drip();
  ambientNodes={master,rainSrc,wind,timers};
}
function stopAmbient(){if(!ambientOn||!ambientNodes)return; ambientOn=false; const ac=ensureAudio(),a=ambientNodes;a.master.gain.cancelScheduledValues(ac.currentTime);a.master.gain.setValueAtTime(Math.max(a.master.gain.value,.0001),ac.currentTime);a.master.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.7);a.timers.forEach(clearTimeout);setTimeout(()=>{try{a.rainSrc.stop();a.wind.stop()}catch(e){}},750);ambientNodes=null;}
// Intentar iniciar el ambiente automáticamente. Si el navegador bloquea el autoplay,
// se inicia en la primera interacción del usuario sin mostrar botones extra.
function tryStartAmbient(){ if(!ambientOn){ try{ startAmbient(); }catch(e){} } }
window.addEventListener('load',()=>setTimeout(tryStartAmbient,120));
document.addEventListener('pointerdown',tryStartAmbient,{once:true});
document.addEventListener('keydown',tryStartAmbient,{once:true});
function pageSound(){
  if(!soundOn) return;
  ensureAudio();
  const now=audioCtx.currentTime, dur=.42, n=Math.floor(audioCtx.sampleRate*dur);
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate), data=buf.getChannelData(0);
  for(let j=0;j<n;j++){const t=j/n; data[j]=(Math.random()*2-1)*(1-t)*(.35+.65*Math.sin(Math.PI*t));}
  const src=audioCtx.createBufferSource(), filter=audioCtx.createBiquadFilter(), gain=audioCtx.createGain();
  filter.type='bandpass'; filter.frequency.setValueAtTime(1500,now); filter.frequency.exponentialRampToValueAtTime(500,now+dur);
  filter.Q.value=.7; gain.gain.setValueAtTime(.0001,now); gain.gain.exponentialRampToValueAtTime(.16,now+.035); gain.gain.exponentialRampToValueAtTime(.0001,now+dur);
  src.buffer=buf; src.connect(filter).connect(gain).connect(audioCtx.destination); src.start(now); src.stop(now+dur);
}
const intro=document.querySelector('#intro'),book=document.querySelector('#book'),page=document.querySelector('#page'),counter=document.querySelector('#counter');
function show(){page.style.animation='none';page.offsetHeight;page.style.animation='';const p=activePoems[i];const tag=visitor?`<div class="personalFor">Para ${escapeHtml(visitor)}</div>`:'';if(i===activePoems.length-1 && activePoems===poems){page.innerHTML=`${tag}<h1>${p[0]}</h1><p>${p[1]}</p>${feedbackHTML()}`;}else if(i===activePoems.length-1 && activePoems===lifePoems){page.innerHTML=`${tag}<h1>${p[0]}</h1><p>${p[1]}</p>${feedbackHTML()}`;}else{page.innerHTML=`${tag}<h1>${p[0]}</h1><p>${p[1]}</p>`;}counter.textContent=`${String(i+1).padStart(2,'0')} / ${String(activePoems.length).padStart(2,'0')}`;document.querySelector('#prev').style.opacity=i?1:.3;document.querySelector('#next').textContent=i===activePoems.length-1?'Volver al inicio':'Siguiente →'}
document.querySelector('#open').onclick=()=>{visitor=document.querySelector('#visitorName').value.trim();if(visitor==='151277'){document.querySelector('#visitorName').value='';visitor='';tryStartAmbient();document.querySelector('#adminPanel').classList.remove('hidden');renderAdmin();return;}activePoems=visitor?poems:lifePoems;if(visitor){const low=visitor.toLocaleLowerCase('es');if(low==='ariana'||low==='camila'){activePoems=poems.map(([t,b],idx)=>idx===0?[t,b]:[idx===activePoems.length-1?t:`${t}, ${visitor}`,b.replaceAll('tú',visitor).replaceAll('Tu ',visitor+' ').replaceAll('tu ',visitor+' ')]);}}recordVisit(visitor||'Sin nombre');i=0;tryStartAmbient();intro.classList.add('fade');setTimeout(()=>{if(ambientOn)stopAmbient();intro.classList.add('hidden');book.classList.remove('hidden');show()},850)};
document.querySelector('#visitorName').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#open').click()});
document.querySelector('#prev').onclick=()=>{if(i>0){pageSound();i--;show()}};document.querySelector('#next').onclick=()=>{pageSound();if(i<activePoems.length-1){i++;show()}else{i=0;show()}};document.querySelector('#soundToggle').onclick=()=>{soundOn=!soundOn;document.querySelector('#soundToggle').textContent=soundOn?'🔊':'🔇'};

function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const DBKEY='entrePaginasDataV81';
function db(){try{return JSON.parse(localStorage.getItem(DBKEY))||{visits:[],suggestions:[],submissions:[]}}catch(e){return{visits:[],suggestions:[],submissions:[]}}}
function saveDB(d){localStorage.setItem(DBKEY,JSON.stringify(d))}
function recordVisit(name){const d=db();d.visits.unshift({name,time:new Date().toISOString()});d.visits=d.visits.slice(0,250);saveDB(d)}
function feedbackHTML(){return `<div class="feedback"><h2>Antes de irte...</h2><p>¿Qué podría mejorar? También puedes dejar un poema para publicarlo como <b>Anónimo</b>. Tu nombre solo será visible en este panel local de administración.</p><textarea id="suggestionText" placeholder="¿Qué podría mejorar?"></textarea><textarea id="poemText" placeholder="Escribe aquí un poema que quieras compartir como Anónimo"></textarea><div class="row"><button onclick="sendSuggestion()">Enviar sugerencia</button><button onclick="sendPoem()">Enviar poema</button></div><div id="feedbackMsg" class="feedbackMsg"></div></div>`}
function sendSuggestion(){const el=document.querySelector('#suggestionText'),v=el?.value.trim();if(!v)return;const d=db();d.suggestions.unshift({name:visitor||'Sin nombre',text:v,time:new Date().toISOString()});saveDB(d);el.value='';document.querySelector('#feedbackMsg').textContent='Sugerencia guardada. Gracias.'}
function sendPoem(){const el=document.querySelector('#poemText'),v=el?.value.trim();if(!v)return;const d=db();d.submissions.unshift({name:visitor||'Sin nombre',text:v,time:new Date().toISOString()});saveDB(d);el.value='';document.querySelector('#feedbackMsg').textContent='Poema guardado. Si se publica, aparecerá como Anónimo.'}
let dotClicks=0,dotTimer;
document.querySelector('#adminDot').onclick=()=>{dotClicks++;clearTimeout(dotTimer);dotTimer=setTimeout(()=>dotClicks=0,1800);if(dotClicks>=4){dotClicks=0;document.querySelector('#adminLogin').classList.remove('hidden');document.querySelector('#adminCode').focus()}}
document.querySelector('#adminEnter').onclick=()=>{if(document.querySelector('#adminCode').value==='151277'){document.querySelector('#adminLogin').classList.add('hidden');document.querySelector('#adminPanel').classList.remove('hidden');renderAdmin();document.querySelector('#adminCode').value='';document.querySelector('#adminError').textContent=''}else document.querySelector('#adminError').textContent='Código incorrecto.'}
document.querySelector('#adminCode').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#adminEnter').click()});
document.querySelectorAll('.closeModal').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.close).classList.add('hidden'));
function fmt(t){try{return new Date(t).toLocaleString('es-MX')}catch(e){return t}}
function renderAdmin(){const d=db(),counts={};d.visits.forEach(v=>counts[v.name]=(counts[v.name]||0)+1);document.querySelector('#adminStats').innerHTML=`<p><b>${d.visits.length}</b> entradas registradas en este navegador · <b>${Object.keys(counts).length}</b> nombres</p>`+Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="adminItem"><b>${escapeHtml(n)}</b> — ${c} entrada${c===1?'':'s'}</div>`).join('');document.querySelector('#recentVisits').innerHTML=d.visits.slice(0,20).map(v=>`<div class="adminItem"><b>${escapeHtml(v.name)}</b><br><span class="small">${fmt(v.time)}</span></div>`).join('')||'<p class="small">Sin actividad todavía.</p>';document.querySelector('#suggestionsList').innerHTML=d.suggestions.map(v=>`<div class="adminItem"><b>${escapeHtml(v.name)}</b> · <span class="small">${fmt(v.time)}</span><br>${escapeHtml(v.text)}</div>`).join('')||'<p class="small">Sin sugerencias.</p>';document.querySelector('#submissionsList').innerHTML=d.submissions.map(v=>`<div class="adminItem"><b>Autor real: ${escapeHtml(v.name)}</b> · <span class="small">${fmt(v.time)}</span><br>${escapeHtml(v.text)}</div>`).join('')||'<p class="small">Sin poemas enviados.</p>'}
document.querySelector('#clearData').onclick=()=>{if(confirm('¿Borrar los datos guardados en este navegador?')){localStorage.removeItem(DBKEY);renderAdmin()}}

const c=document.querySelector('#rain'),x=c.getContext('2d');let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array.from({length:Math.floor(innerWidth/7)},()=>({x:Math.random()*c.width,y:Math.random()*c.height,l:10+Math.random()*24,s:5+Math.random()*8,a:.12+Math.random()*.28}))}addEventListener('resize',resize);resize();function rain(){x.clearRect(0,0,c.width,c.height);x.lineWidth=1;for(const d of drops){x.strokeStyle=`rgba(220,225,230,${d.a})`;x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x-2,d.y+d.l);x.stroke();d.y+=d.s;if(d.y>c.height){d.y=-d.l;d.x=Math.random()*c.width}}requestAnimationFrame(rain)}rain();
</script></body></html>
